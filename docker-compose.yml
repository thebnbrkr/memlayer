# Memlayer - Self-Hosted Setup
# ==============================
#
# Quick start:
#   1. Copy .env.example to .env and configure
#   2. Run: docker-compose up -d
#   3. Visit: http://localhost:8000/docs

version: '3.8'

services:
  # PostgreSQL - For salience logs and config storage
  postgres:
    image: postgres:15-alpine
    container_name: memlayer-postgres
    environment:
      POSTGRES_DB: memlayer
      POSTGRES_USER: memlayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeMe123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memlayer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Memlayer API Server
  memlayer:
    build: .
    container_name: memlayer-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # OpenAI API
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Database
      DATABASE_URL: postgresql://memlayer:${POSTGRES_PASSWORD:-changeMe123!}@postgres:5432/memlayer

      # Storage
      STORAGE_PATH: /app/data

      # Operation mode (online, local, lightweight)
      OPERATION_MODE: ${OPERATION_MODE:-online}

      # Optional: Rate limiting
      RATE_LIMIT: ${RATE_LIMIT:-100/hour}

      # Optional: Debug mode
      DEBUG_MODE: ${DEBUG_MODE:-false}

    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Optional: Memgraph (for production graph storage)
  # Uncomment to use instead of NetworkX
  # memgraph:
  #   image: memgraph/memgraph:latest
  #   container_name: memlayer-memgraph
  #   ports:
  #     - "7687:7687"
  #   volumes:
  #     - memgraph_data:/var/lib/memgraph
  #   profiles:
  #     - production
  #   restart: unless-stopped

  # Optional: Qdrant (for production vector storage)
  # Uncomment to use instead of ChromaDB
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: memlayer-qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   profiles:
  #     - production
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  # memgraph_data:
  #   driver: local
  # qdrant_data:
  #   driver: local

networks:
  default:
    name: memlayer-network
